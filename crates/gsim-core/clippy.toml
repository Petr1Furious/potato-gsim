# gsim-core must be bit-reproducible across machines. Only IEEE-exact operations
# (+ - * / sqrt) are allowed on f64; everything else goes through `crate::math` (libm).
disallowed-methods = [
    "f64::sin", "f64::cos", "f64::tan", "f64::sin_cos", "f64::asin", "f64::acos", "f64::atan",
    "f64::atan2", "f64::exp", "f64::exp2", "f64::exp_m1", "f64::ln", "f64::log", "f64::log2",
    "f64::log10", "f64::ln_1p", "f64::powf", "f64::powi", "f64::cbrt", "f64::hypot",
    "f64::mul_add", "f64::sinh", "f64::cosh", "f64::tanh",
]
