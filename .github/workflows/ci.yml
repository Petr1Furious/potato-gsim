name: CI

# Every push and pull request is tested and built for all platforms (downloadable as
# workflow artifacts). Pushes to master refresh the rolling "latest" release; pushing a tag
# like v0.2.0 publishes a versioned one.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # The determinism rules for the simulation core live in its clippy.toml.
      - run: cargo clippy -p gsim-core --lib --locked -- -D clippy::disallowed_methods

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-universal, os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: ./scripts/ci/package.sh "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: potato-gsim-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    # v* tags publish a versioned release; every push to master refreshes the rolling
    # "latest" release, so one download link always has the newest build.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ROLLING: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the version the self-updater compares against
        if: env.ROLLING == 'true'
        run: echo "$GITHUB_SHA" > dist/version.txt
      - name: Move the "latest" tag to this commit
        if: env.ROLLING == 'true'
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ROLLING == 'true' && 'latest' || github.ref_name }}
          name: ${{ env.ROLLING == 'true' && 'Latest build' || github.ref_name }}
          files: dist/*
          make_latest: true
          generate_release_notes: ${{ env.ROLLING != 'true' }}
          body: |
            ${{ env.ROLLING == 'true' && format('Built from {0}. This release is replaced on every push to master.', github.sha) || '' }}

            **Download**
            - Windows: `potato-gsim-windows-x86_64.zip`, run `Potato Gravity Simulator.exe`.
            - macOS (Apple Silicon and Intel): `potato-gsim-macos-universal.dmg`. The app is not
              notarised: the first time, right-click it and choose **Open**, or run
              `xattr -dr com.apple.quarantine "/Applications/Potato Gravity Simulator.app"`.
            - Linux: `potato-gsim-linux-x86_64.tar.gz` (also contains the dedicated server).

            The `gsim-client-*` files and `version.txt` are for the built-in updater.

            Client and server must be the same build; a mismatched client is refused with a message.
